name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and release notes
        id: meta
        run: |
          set -euo pipefail

          version=$(sed -n 's/^## \[\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)\].*/\1/p' CHANGELOG.md | head -n 1)

          if [ -z "$version" ] || [ "$version" = "0.0.0" ]; then
            echo "::error::CHANGELOG.md has no released version at the top (found '${version:-none}'). Merge a release branch into master first."
            exit 1
          fi

          project=$(node -p "require('./package.json').name")
          heading="## [$version]"
          awk -v heading="$heading" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          sed -i '/./,$!d' release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::The CHANGELOG entry for v$version is empty."
            exit 1
          fi

          {
            echo "version=$version"
            echo "project=$project"
          } >> "$GITHUB_OUTPUT"

          echo "Preparing release notes for $project v$version"
          echo "-----"
          cat release-notes.md
          echo "-----"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          PROJECT: ${{ steps.meta.outputs.project }}
        run: |
          set -euo pipefail

          tag="v$VERSION"
          title="$PROJECT $tag"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $title already exists; updating its notes."
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file release-notes.md
            exit 0
          fi

          target_args=(--target "$GITHUB_SHA")
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            target_args=()
          fi

          gh release create "$tag" "${target_args[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes-file release-notes.md
